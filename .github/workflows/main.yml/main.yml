name: Continuous Integration & Continuous Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Python Code
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Build Docker Compose Stack
        run: |
          docker-compose build

      - name: Test Docker Container Startup
        run: |
          docker-compose up -d
          # Give services a few seconds to spin up
          sleep 10
          docker-compose ps

      - name: Health Check Backend & Frontend
        run: |
          curl --fail http://localhost:8001/docs || exit 1
          curl --fail http://localhost:8501 || exit 1

      - name: Tear Down Containers
        if: always()
        run: |
          docker-compose down